<polygon points="890,291 884,279 896,279" fill="#EDE7DC"/>
<rect x="815" y="292" width="150" height="64" rx="4" fill="none" stroke="#EDE7DC" stroke-width="1"/>
<text x="890" y="320" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">caller B</text>
<text x="890" y="344" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#D8D3CA">num_ctx 16384</text>
<line x1="890" y1="356" x2="890" y2="377" stroke="#EDE7DC" stroke-width="2"/>
<polygon points="890,389 884,377 896,377" fill="#EDE7DC"/>
<line x1="890" y1="254" x2="1053.3" y2="288.5" stroke="#EDE7DC" stroke-width="2"/>
<polygon points="1065,291 1052.0,294.4 1054.5,282.6" fill="#EDE7DC"/>
<rect x="990" y="292" width="150" height="64" rx="4" fill="none" stroke="#EDE7DC" stroke-width="1"/>
<text x="1065" y="320" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">caller C</text>
<text x="1065" y="344" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#D8D3CA">num_ctx 16384</text>
<line x1="1065" y1="356" x2="1046.2" y2="379.6" stroke="#EDE7DC" stroke-width="2"/>
<polygon points="1038.8,389 1041.5,375.9 1050.9,383.3" fill="#EDE7DC"/>
<rect x="700" y="390" width="380" height="76" rx="4" fill="#59591D"/>
<text x="890" y="422" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">one runner stays loaded</text>
<text x="890" y="448" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#F2EDE2">same window for every caller</text>
</svg>
