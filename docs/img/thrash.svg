<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Two windows thrash one runner; one table fixes it</title>
<desc id="desc">Two callers asked one model for num_ctx 8192 and 40960, so each load evicted the other with a 19 GB reload until the evicted call failed at the 5-minute timeout; after the fix every caller reads one window, 16384, from one table and the runner stays loaded.</desc>
<rect x="0.5" y="0.5" width="1199" height="489" fill="#001B3B" stroke="#EDE7DC" stroke-width="1"/>
<text x="40" y="56" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#F2EDE2">Before: two windows, one runner</text>
<text x="40" y="84" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">July 28, 2026, 16:05 to 16:46</text>
<rect x="60" y="112" width="230" height="72" rx="4" fill="none" stroke="#EDE7DC" stroke-width="1"/>
<text x="175" y="142" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">receipt reader</text>
<text x="175" y="168" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#D8D3CA">num_ctx 8192</text>
<rect x="330" y="112" width="230" height="72" rx="4" fill="none" stroke="#EDE7DC" stroke-width="1"/>
<text x="445" y="142" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">voice summarizer</text>
<text x="445" y="168" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#D8D3CA">num_ctx 40960</text>
<line x1="175" y1="184" x2="241.5" y2="270.9" stroke="#8C5348" stroke-width="3"/>
<polygon points="250,282 235.9,275.1 247.1,266.6" fill="#8C5348"/>
<line x1="445" y1="184" x2="378.5" y2="270.9" stroke="#8C5348" stroke-width="3"/>
<polygon points="370,282 372.9,266.6 384.1,275.1" fill="#8C5348"/>
<text x="196" y="240" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" text-anchor="end" fill="#D8D3CA">loads at 8192</text>
<text x="424" y="240" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">loads at 40960</text>
<text x="310" y="214" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#F2EDE2">each load</text>
<text x="310" y="236" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#F2EDE2">evicts the other</text>
<rect x="160" y="284" width="300" height="72" rx="4" fill="none" stroke="#EDE7DC" stroke-width="2"/>
<text x="310" y="314" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">one runner per model</text>
<text x="310" y="340" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#D8D3CA">19 GB reload on each switch</text>
<line x1="310" y1="356" x2="310" y2="375" stroke="#8C5348" stroke-width="3"/>
<polygon points="310,389 303,375 317,375" fill="#8C5348"/>
<rect x="80" y="390" width="460" height="76" rx="4" fill="#8C5348"/>
<text x="310" y="422" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">the evicted call hangs</text>
<text x="310" y="448" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#F2EDE2">load timeout: Ollama returns 500 at 5m0s</text>
<line x1="600" y1="40" x2="600" y2="450" stroke="#D8D3CA" stroke-width="1"/>
<text x="620" y="56" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#F2EDE2">After: one table, one window</text>
<text x="620" y="84" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">Callers read the window instead of writing a number.</text>
<rect x="700" y="112" width="380" height="72" rx="4" fill="none" stroke="#EDE7DC" stroke-width="1"/>
