<line x1="890" y1="254" x2="726.7" y2="288.5" stroke="#EDE7DC" stroke-width="2"/>
<polygon points="715,291 725.5,282.6 728.0,294.4" fill="#EDE7DC"/>
<rect x="640" y="292" width="150" height="64" rx="4" fill="none" stroke="#EDE7DC" stroke-width="1"/>
<text x="715" y="320" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#F2EDE2">caller A</text>
<text x="715" y="344" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#D8D3CA">num_ctx 16384</text>
<line x1="715" y1="356" x2="733.8" y2="379.6" stroke="#EDE7DC" stroke-width="2"/>
<polygon points="741.3,389 729.1,383.3 738.5,375.9" fill="#EDE7DC"/>
