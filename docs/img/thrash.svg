<text x="890" y="168" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#D8D3CA">&quot;qwen3.6:27b&quot;: 16384</text>
<line x1="890" y1="184" x2="890" y2="203" stroke="#EDE7DC" stroke-width="2"/>
<polygon points="890,215 884,203 896,203" fill="#EDE7DC"/>
<rect x="790" y="216" width="200" height="38" rx="19" fill="none" stroke="#EDE7DC" stroke-width="1"/>
